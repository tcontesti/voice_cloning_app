# Vault dev server. Activate with `make vault` or:
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.override.dev.yml \
#                  -f infra/docker-compose.vault.yml \
#                  --env-file .env up -d vault
#
# WARNING: dev mode stores everything in-memory, unsealed, with a root token
# printed to logs. NEVER use dev mode in production. This file is an
# integration harness to verify the backend works with a real Vault;
# prod deploys via Helm with a proper HA Vault cluster.
services:
  vault:
    image: hashicorp/vault:1.18.3
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-vcapp-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    command: ["vault", "server", "-dev"]
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8200/v1/sys/health?standbyok=true"]
      interval: 10s
      retries: 10
    restart: unless-stopped
