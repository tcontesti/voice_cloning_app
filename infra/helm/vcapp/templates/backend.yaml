apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vcapp.fullname" . }}-backend
  labels: {{- include "vcapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels: {{- include "vcapp.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vcapp.backend.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          env:
            {{- range $k, $v := .Values.backend.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
            - name: POSTGRES_HOST
              value: "{{ .Release.Name }}-postgresql"
            - name: REDIS_HOST
              value: "{{ .Release.Name }}-redis-master"
            - name: RABBITMQ_HOST
              value: "{{ .Release.Name }}-rabbitmq"
            - name: MINIO_HOST
              value: "{{ .Release.Name }}-minio"
          envFrom:
            - secretRef: {name: vcapp-secrets}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vcapp.fullname" . }}-backend
  labels: {{- include "vcapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports: [{port: 8000, targetPort: http, name: http}]
  selector: {{- include "vcapp.backend.selectorLabels" . | nindent 4 }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vcapp.fullname" . }}-backend
  labels: {{- include "vcapp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "vcapp.backend.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
