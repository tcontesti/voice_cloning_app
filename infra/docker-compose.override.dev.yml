services:
  postgres:
    ports: ["5432:5432"]

  redis:
    ports: ["6379:6379"]

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    ports: ["8000:8000"]
    volumes:
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
