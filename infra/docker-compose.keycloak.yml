# Keycloak — activate with `make keycloak` or:
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.override.dev.yml \
#                  -f infra/docker-compose.keycloak.yml \
#                  --env-file .env up -d keycloak
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./keycloak/realm-vcapp.json:/opt/keycloak/data/import/realm-vcapp.json:ro
      - kcdata:/opt/keycloak/data
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 15s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  kcdata:
