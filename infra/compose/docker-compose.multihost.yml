# Multi-host dev: Postgres + Redis + Backend + nginx on the PC.
# RabbitMQ + MinIO live on the Spark (already running there) and are
# reached via SSH tunnel → host.docker.internal.
#
# Frontend is NOT in this compose — run `npm run dev` natively on the PC
# so Vite HMR stays fast.
name: vcapp-multihost

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "100"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      APP_SECRET_KEY: ${APP_SECRET_KEY}

      # Local containers
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Reached through SSH tunnel on the host's loopback
      # (Windows Docker Desktop maps host.docker.internal → host loopback)
      RABBITMQ_HOST: host.docker.internal
      # Tunnel binds non-default ports on the host to avoid clashing with a
      # local rabbitmq/minio (Docker Desktop, other projects). Override in
      # .env.multihost; defaults match the dev_start.ps1 forwards.
      RABBITMQ_PORT: ${RABBITMQ_TUNNEL_PORT:-5682}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_HOST: host.docker.internal
      MINIO_PORT: ${MINIO_TUNNEL_PORT:-9010}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"
      STORAGE_ENCRYPTION: none
      MINIO_BUCKET_RECORDINGS: recordings
      MINIO_BUCKET_SYNTHESES: syntheses

      # Auth + crypto stay in mock mode for private pilot
      AUTH_MODE: mock
      KMS_MODE: mock
      KMS_MOCK_KEY: ${KMS_MOCK_KEY}

      CORS_ALLOWED_ORIGINS: http://localhost:5173,https://localhost

      # ElevenLabs cloud adapter — gates the /synthesis/models entry + the
      # `elevenlabs` enum branch. Key lives on the worker_elevenlabs side;
      # API only needs to know it's available to expose it to the UI.
      ELEVENLABS_ENABLED: ${ELEVENLABS_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    # host-gateway lets Linux + Windows both resolve the SSH-tunnel loopback.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../backend/app:/app/app
      - ../../backend/tests:/app/tests
      - ../../backend/alembic:/app/alembic
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  worker_elevenlabs:
    build: {context: ../../backend, dockerfile: Dockerfile}
    env_file: .env.multihost
    environment:
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5682
      MINIO_HOST: host.docker.internal
      MINIO_PORT: 9010
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELEVENLABS_ENABLED: ${ELEVENLABS_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../backend/app:/app/app
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--queues=synth.elevenlabs", "--hostname=worker-elevenlabs@%h"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
