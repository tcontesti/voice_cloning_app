[project]
name = "vcapp-backend"
version = "0.1.0"
description = "Voice Cloning App — backend (Hospital Son Llatzer)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "uuid6>=2024.7",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",  # passlib 1.7.4 is incompatible with bcrypt 4.1+ (missing __about__)
    "python-multipart>=0.0.20",
    "minio>=7.2",
    "soundfile>=0.12",
    "numpy>=1.26,<2.0",
    "webrtcvad-wheels>=2.0.14",
    "pyloudnorm>=0.1.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.7",
    "mypy>=1.13",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
